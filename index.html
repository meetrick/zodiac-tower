<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zodiac Tower - 우주 콩콩 동물탑</title>
  <meta name="description" content="12간지 동물을 차곡차곡 쌓아 우주까지 올라가는 원버튼 캐주얼 게임">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zodiac Tower">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <canvas id="game" aria-label="Zodiac Tower 게임 화면"></canvas>
  <div id="safe-probe" aria-hidden="true"></div>

  <button type="button" id="rankOpenBtn" class="ui-fab" aria-label="랭킹 보기">🏆</button>

  <div id="resultOverlay" class="overlay hidden" aria-hidden="true">
    <div class="sheet">
      <h2 id="resultTitle">와르르~! 💥</h2>
      <div id="resultMode" class="mode-chip"></div>
      <div id="resultScore" class="score">0층</div>
      <p id="resultBest" class="sub"></p>
      <label class="field">
        <span>이름</span>
        <input id="resultName" type="text" maxlength="10" autocomplete="nickname" enterkeyhint="done" placeholder="이름을 남겨 주세요">
      </label>
      <p id="resultMsg" class="msg"></p>
      <div class="actions">
        <button type="button" id="resultSave" class="btn primary">기록 남기기</button>
        <button type="button" id="resultRank" class="btn">🏆 전체 랭킹</button>
        <button type="button" id="resultRetry" class="btn">다시 하기</button>
        <button type="button" id="resultModeBtn" class="btn ghost">난이도 바꾸기</button>
      </div>
    </div>
  </div>

  <div id="rankOverlay" class="overlay hidden" aria-hidden="true">
    <div class="sheet rank-sheet">
      <div class="rank-head">
        <h2>전체 랭킹</h2>
        <button type="button" id="rankClose" class="btn icon" aria-label="닫기">✕</button>
      </div>
      <div id="rankModes" class="mode-tabs" role="tablist"></div>
      <p id="rankMine" class="mine"></p>
      <div id="rankBody" class="rank-list" role="list"></div>
      <p id="rankNote" class="msg"></p>
    </div>
  </div>

  <noscript>이 게임을 하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
